services:
  nats-hub:
    image: nats:latest
    command: ["-c", "/etc/nats/nats-hub.conf"]
    volumes:
      - ./config/nats-hub.conf:/etc/nats/nats-hub.conf
      - ./nats-data:/data   # para que los mensajes en el stream persistan
    ports:
      - "3222:4222"

  nats-a:
    image: nats:latest
    command: ["-c", "/etc/nats/nats-a.conf"]
    ports:
      - "4222:4222"
    volumes:
      - ./config/nats-a.conf:/etc/nats/nats-a.conf
    depends_on:
      - nats-hub

  nats-b:
    image: nats:latest
    command: ["-c", "/etc/nats/nats-b.conf"]
    ports:
      - "5222:4222"
    volumes:
      - ./config/nats-b.conf:/etc/nats/nats-b.conf
    depends_on:
      - nats-hub
